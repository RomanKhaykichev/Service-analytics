# Local desktop edition (API + DB + web). Does not replace docker-compose.yml.
# Start: start.bat   Stop: stop.bat
# Project name is fixed so this stack never collides with service-analytics-* containers.

name: profiboard-local

services:
  db:
    image: postgres:16
    container_name: profiboard-local-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-service_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-service_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - profiboard-local

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: profiboard-local-api
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-service_analytics}
      DB_SCHEMA: ${DB_SCHEMA:-app}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-service_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-secret-key-min-32-chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SMS_DEBUG_LOG_CODE: ${SMS_DEBUG_LOG_CODE:-true}
      UVICORN_PROXY_HEADERS: ${UVICORN_PROXY_HEADERS:-1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12,10.0.0.0/8}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 50s
      retries: 5
    restart: unless-stopped
    volumes:
      - api_uploads_local:/apps/api/uploads
    networks:
      - profiboard-local

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: profiboard-local-web
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - profiboard-local

volumes:
  pgdata_local:
  api_uploads_local:

networks:
  profiboard-local:
    driver: bridge
