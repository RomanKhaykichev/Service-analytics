version: '3.8'

services:
  db:
    image: postgres:16
    container_name: service-analytics-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-service_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-service_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - service-analytics-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: service-analytics-api
    environment:
      # Database connection
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/service_analytics}
      DB_SCHEMA: ${DB_SCHEMA:-app}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-service_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # App settings
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_DEV_USER_ID: ${DEFAULT_DEV_USER_ID:-00000000-0000-0000-0000-000000000001}
      # JWT (use strong secrets in production!)
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-secret-key-min-32-chars}
      # Uvicorn: trust X-Forwarded-Proto/For from nginx on host (127.0.0.1) + Docker networks
      UVICORN_PROXY_HEADERS: ${UVICORN_PROXY_HEADERS:-1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12,10.0.0.0/8}
    ports:
      # Only localhost on the host — nginx on the same machine proxies to 127.0.0.1:8000
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    volumes:
      # Excel uploads from imports.py resolve to /apps/api/uploads in the container (see runbook)
      - api_uploads:/apps/api/uploads
    networks:
      - service-analytics-network

volumes:
  pgdata:
    driver: local
  api_uploads:
    driver: local

networks:
  service-analytics-network:
    driver: bridge
