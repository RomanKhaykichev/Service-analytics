version: '3.8'

services:
  db:
    image: postgres:16
    container_name: service-analytics-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-service_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-service_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - service-analytics-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: service-analytics-api
    environment:
      # Database connection
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/service_analytics}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-service_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - service-analytics-network

volumes:
  pgdata:
    driver: local

networks:
  service-analytics-network:
    driver: bridge
